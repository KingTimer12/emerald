[package]
name = "emerald-discord"
description = "Discord as its web client speaks it: REST endpoints, the gateway, models and packets."
version.workspace = true
edition.workspace = true

[dependencies]
emerald-core.workspace = true
emerald-http.workspace = true
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
image.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

# The token in the login Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

# The token in Credential Manager; WinRT for the timezone.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Foundation", "Globalization", "Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
