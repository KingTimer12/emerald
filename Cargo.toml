# Emerald is split into crates at the root, each named `emerald-*`:
#
# - emerald-core: paths, interface text (i18n), frame decoding, processes
# - emerald-http: HTTP transport with base URLs, rate limits, microcache and
#   disk cache
# - emerald-audio: microphone and speaker streams in 48 kHz frames, device
#   lists and noise suppression
# - emerald-discord: Discord's REST API, gateway, models and wire packets
# - emerald-ui: the gpui interface, its components and the settings
# - emerald-webview: a blocking native webview window (macOS and Windows)
# - emerald-notify: desktop notifications and the unread badge on the app icon
# - emerald-desktop: start on login, one instance at a time, and updates
#   from a signed release feed
# - emerald-bin: the executable, the login and captcha flows, logging
[workspace]
resolver = "3"
members = [
    "emerald-core", "emerald-http", "emerald-audio", "emerald-discord", "emerald-ui", "emerald-webview", "emerald-notify", "emerald-desktop", "emerald-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
emerald-core = { path = "emerald-core" }
emerald-http = { path = "emerald-http" }
emerald-audio = { path = "emerald-audio" }
emerald-discord = { path = "emerald-discord" }
emerald-ui = { path = "emerald-ui" }
emerald-webview = { path = "emerald-webview" }
emerald-notify = { path = "emerald-notify" }
emerald-desktop = { path = "emerald-desktop" }

# runtime_shaders: compiles Metal shaders at runtime (no full Xcode needed).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "gzip", "deflate", "brotli", "zstd"] }
# The one CryptoProvider (ring) for reqwest and tungstenite.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Gateway zlib-stream: zlib-rs inflates faster than the default miniz_oxide
# and wins over it in every crate that uses flate2.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
unicode-segmentation = "1"
# FxHash for maps keyed by ids: much cheaper than SipHash, and ids are not
# chosen by an attacker. Maps keyed by text from the network keep SipHash.
rustc-hash = "2"
# Profiling, off unless built with `--features hotpath` (see emerald-bin).
hotpath = { version = "0.30", default-features = false }
anyhow = "1"
# localtime_r / localtime_s, for message timestamps in the user's timezone.
libc = "0.2"
sys-locale = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# Lottie stickers: velato reads the animation, vello_cpu draws each frame on
# the CPU; both pure Rust. `image` is the one gpui already uses for frames.
velato = { version = "0.12", default-features = false }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }
# GIF, WebP and APNG (Nitro cosmetics) for animated media, decoded off the UI thread (`frames.rs`).
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png"] }
# Scales those frames down with SIMD; RGBA only, which keeps it small.
fast_image_resize = { version = "6.1", default-features = false, features = ["std", "only_u8x4"] }
# Disk cache in one SQLite file; bundled, so no system library is needed.
rusqlite = { version = "0.40", features = ["bundled"] }
bytes = "1"
# Release signatures for updates: ed25519 over a SHA-512 of the file, so
# a download is checked without holding it all in memory. Both are already
# in the tree through DAVE.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "digest"] }
sha2 = "0.10"
# Wipes the token from memory when it is dropped.
zeroize = "1"
emojis = "0.9.1"
# Voice: devices, codec, noise suppression, DAVE end-to-end encryption and
# the WebRTC transport (ICE, DTLS, SRTP) with pure-Rust crypto. libopus is
# built from source, so nothing has to be installed.
cpal = { version = "0.18", default-features = false }
rtrb = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }
davey = "0.1.5"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# macOS: the Keychain, and the login page in a native WKWebView. Versions
# match the ones gpui already resolves, so Cargo deduplicates them and objc2
# types stay compatible.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
# Windows: WebView2 for the login page, Credential Manager and WinRT.
# Versions match webview2-com's.
webview2-com = "0.39"
windows = "0.62"
windows-core = "0.62"
embed-resource = "3"

# Debug builds still draw Lottie stickers at full speed: unoptimized, a
# frame takes 50 ms instead of half a millisecond.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.velato]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, so a Lottie sticker velato cannot handle (it has todo!s for
# some valid files) fails alone instead of taking the app down.
panic = "unwind"
