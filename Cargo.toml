[package]
name = "emerald"
version = "0.1.0"
edition = "2024"

[dependencies]
# runtime_shaders: compila shaders Metal no runtime (dispensa Xcode completo)
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "gzip", "deflate", "brotli", "zstd"] }
# Único CryptoProvider (ring) para reqwest e tungstenite.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
unicode-segmentation = "1"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# localtime_r / localtime_s, for message timestamps in the user's timezone.
libc = "0.2"
sys-locale = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# Lottie stickers: velato reads the animation, vello_cpu draws each frame on
# the CPU; both pure Rust. `image` is the one gpui already uses for frames.
velato = { version = "0.12", default-features = false }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }
image = { version = "0.25", default-features = false }
# Wipes the token from memory when it is dropped.
zeroize = "1"

# Login webview oficial (WKWebView nativo). Versões casadas com as que o gpui
# já resolve, para o Cargo deduplicar e não gerar tipos objc2 incompatíveis.
[target.'cfg(target_os = "macos")'.dependencies]
# Token in the login Keychain.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSURL", "NSURLRequest", "NSDate", "NSRunLoop", "NSGeometry",
    "NSObjCRuntime", "NSNotification",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSWindow", "NSView", "NSResponder", "NSEvent",
    "NSGraphics", "NSRunningApplication",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView", "WKWebViewConfiguration", "WKUserContentController",
    "WKUserScript", "WKScriptMessageHandler", "WKScriptMessage", "WKWebsiteDataStore",
    "WKFrameInfo", "WKSecurityOrigin",
] }

# Login webview no Windows: WebView2 (Edge/Chromium), o mesmo runtime que
# o Windows 11 já traz. Versões casadas com o webview2-com.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation", "Globalization",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com",
    "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

# Embeds assets/emerald.ico into the Windows executable (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Debug builds still draw Lottie stickers at full speed: unoptimized, a
# frame takes 50 ms instead of half a millisecond.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.velato]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwinding, so a Lottie sticker velato cannot handle (it has todo!s for
# some valid files) fails alone instead of taking the app down.
panic = "unwind"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
